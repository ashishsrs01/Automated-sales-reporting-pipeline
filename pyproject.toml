[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-sales-reporting-pipeline"
version = "1.0.0"
description = "Automated sales analytics and executive reporting pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.4",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"